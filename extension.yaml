manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.data-connector-mcp-toolbox-mssql
kind: tool_provider
version: 1.3.2
release_stage: active
display_name: Microsoft SQL Server
description: Microsoft SQL Server dataset reads and parameterized workflow INSERT,
  UPDATE and DELETE.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-data-mssql/issues
  website_url: https://github.com/Flow-Steward/ext-data-mssql
listing:
  category: data
  tags:
  - mssql
  - database
  - sql
  - dataset
  summary: Microsoft SQL Server dataset reads and parameterized workflow INSERT, UPDATE
    and DELETE.
  description: Connect Microsoft SQL Server datasets, inspect schemas, preview saved
    queries, and run bounded workflow writes.
package:
  format: flow-steward-extension
  license: Apache-2.0
  includes_source: true
billing_mode: free
upgrade_notes: Preserves the installed extension and connection identifiers. Settings
  and packaging now belong exclusively to Microsoft SQL Server.
screenshots:
- label: Overview
  description: Microsoft SQL Server connection profiles and supported operations.
  path: ui/components/overview.yaml
features:
- tool
- dataset_connector
- action
- query
required_scopes:
- extension:invoke
machine_auth:
  service_account_key: svc_ext_data_connector_mcp_toolbox_mssql
  required_scopes:
  - extension:invoke
account_scope:
  scope_type: project
  description: Microsoft SQL Server connections are project-scoped and resolved through
    project config and secrets.
external_effects:
- operation_id: execute_write
  effect_kind: database_write
  channel: toolbox
  idempotency: required
  test_mode_behavior: suppress
schemas:
  config: schemas/config.schema.yaml
  secrets: schemas/secrets.schema.yaml
  subscriptions: schemas/subscriptions.schema.yaml
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
query_manifest: ui/queries/queries.yaml
action_manifest: ui/actions/actions.yaml
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types:
    - connection_type_id: toolbox_sql_writer
      display_name: Microsoft SQL Server
      description: Project connection for parameterized Microsoft SQL Server workflow
        writes.
      config_schema:
        type: object
        additionalProperties: false
        required:
        - prebuilt
        properties:
          prebuilt:
            type: string
            title: Connection profile
            enum: &id001
            - mssql
            - cloud-sql-mssql
            description: Select a Microsoft SQL Server connection profile.
          host:
            type: string
            title: Host
            minLength: 1
          port:
            type: integer
            title: Port
            minimum: 1
            maximum: 65535
          database:
            type: string
            title: Database
            minLength: 1
          user:
            type: string
            title: User
            minLength: 1
          project:
            type: string
            title: Cloud project
            minLength: 1
          region:
            type: string
            title: Cloud region
            minLength: 1
          instance:
            type: string
            title: Instance
            minLength: 1
          ip_type:
            type: string
            title: IP type
        allOf:
        - if:
            properties:
              prebuilt:
                const: mssql
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: cloud-sql-mssql
            required:
            - prebuilt
          then:
            required:
            - database
            - project
            - region
            - instance
            - user
        title: Microsoft SQL Server connection
      secret_schema:
        type: object
        additionalProperties: false
        properties:
          password:
            type: string
            title: Password
            minLength: 1
            description: Password is required for mssql, cloud-sql-mssql. Supply password
              or the matching profile-specific secret env variable. Managed PostgreSQL/MySQL/AlloyDB
              IAM profiles keep password optional; public config env is not a credential
              source.
          env:
            type: object
            title: Profile-specific secret environment
            additionalProperties: false
            properties:
              CLOUD_SQL_MSSQL_PASSWORD:
                type: string
                minLength: 1
              MSSQL_PASSWORD:
                type: string
                minLength: 1
        title: Microsoft SQL Server password
        description: Password is required for mssql, cloud-sql-mssql. Supply password
          or the matching profile-specific secret env variable. Managed PostgreSQL/MySQL/AlloyDB
          IAM profiles keep password optional; public config env is not a credential
          source.
        anyOf:
        - required:
          - password
        - required:
          - env
          properties:
            env:
              anyOf:
              - required:
                - CLOUD_SQL_MSSQL_PASSWORD
              - required:
                - MSSQL_PASSWORD
      capabilities:
        write_queries: true
      safety_profile:
        stores_secret_values: false
    dataset_connectors:
    - connector_id: toolbox_database
      connector_type_id: toolbox_database
      database_kind: database
      display_name: Microsoft SQL Server
      description: Read-only schema inspection and saved queries for Microsoft SQL
        Server.
      source_kind: database
      source_extension_id: flowsteward.data-connector-mcp-toolbox-mssql
      source_extension_name: Microsoft SQL Server
      source_provider: Microsoft SQL Server
      query_language: sql
      access_mode: read_only
      runtime_kind: local_extension
      runtime_adapter_ref: extensions/flowsteward_data_connector_mcp_toolbox_mssql/main.py
      connector_catalog:
      - source_kind: cloud-sql-mssql
        connector_type_id: toolbox_cloud_sql_mssql
        display_name: Cloud SQL for SQL Server
        query_language: sql
        preset_config:
          prebuilt: cloud-sql-mssql
      - source_kind: mssql
        connector_type_id: toolbox_mssql
        display_name: Microsoft SQL Server
        query_language: sql
        preset_config:
          prebuilt: mssql
      connection_schema:
        type: object
        additionalProperties: false
        required:
        - prebuilt
        properties:
          prebuilt:
            type: string
            title: Connection profile
            enum: *id001
            description: Select a Microsoft SQL Server connection profile.
          database:
            type: string
            title: Database or dataset
            description: Database, dataset, namespace, or local file value used by
              this Toolbox source when applicable.
          host:
            type: string
            title: Host
            description: Host for networked Toolbox sources when applicable.
          port:
            type: integer
            minimum: 1
            maximum: 65535
            title: Port
            description: Port for networked Toolbox sources when applicable.
          user:
            type: string
            title: User
            description: User name for sources that authenticate with a database user.
          project:
            type: string
            title: Cloud project
          region:
            type: string
            title: Cloud region
          instance:
            type: string
            title: Instance
          ip_type:
            type: string
            title: IP type
          env:
            type: object
            title: Profile environment overrides
            additionalProperties: false
            properties:
              CLOUD_SQL_MSSQL_PROJECT:
                type: string
              CLOUD_SQL_MSSQL_REGION:
                type: string
              CLOUD_SQL_MSSQL_INSTANCE:
                type: string
              CLOUD_SQL_MSSQL_DATABASE:
                type: string
              CLOUD_SQL_MSSQL_USER:
                type: string
              CLOUD_SQL_MSSQL_IP_TYPE:
                type: string
              MSSQL_HOST:
                type: string
              MSSQL_PORT:
                type: string
              MSSQL_DATABASE:
                type: string
              MSSQL_USER:
                type: string
        allOf:
        - if:
            properties:
              prebuilt:
                const: mssql
            required:
            - prebuilt
          then:
            required:
            - database
            - host
            - user
        - if:
            properties:
              prebuilt:
                const: cloud-sql-mssql
            required:
            - prebuilt
          then:
            required:
            - database
            - project
            - region
            - instance
            - user
        title: Microsoft SQL Server connection
      secret_schema:
        type: object
        additionalProperties: false
        properties:
          password:
            type: string
            title: Password
            minLength: 1
            description: Password is required for mssql, cloud-sql-mssql. Supply password
              or the matching profile-specific secret env variable. Managed PostgreSQL/MySQL/AlloyDB
              IAM profiles keep password optional; public config env is not a credential
              source.
          env:
            type: object
            title: Profile-specific secret environment
            additionalProperties: false
            properties:
              CLOUD_SQL_MSSQL_PASSWORD:
                type: string
                minLength: 1
              MSSQL_PASSWORD:
                type: string
                minLength: 1
        description: Password is required for mssql, cloud-sql-mssql. Supply password
          or the matching profile-specific secret env variable. Managed PostgreSQL/MySQL/AlloyDB
          IAM profiles keep password optional; public config env is not a credential
          source.
        anyOf:
        - required:
          - password
        - required:
          - env
          properties:
            env:
              anyOf:
              - required:
                - CLOUD_SQL_MSSQL_PASSWORD
              - required:
                - MSSQL_PASSWORD
      capabilities:
        read_only: true
        test_connection: true
        schema_introspection: true
        validate_query: true
        preview_query: true
        execute_template: true
        infer_output_schema: true
        write_queries: false
        row_preview: true
      safety_profile:
        access_mode: read_only
        indexes_rows: false
        executes_write_queries: false
        requires_saved_template: true
      preview_support: true
      schema_refresh_support: true
    operation_manifest:
    - operation_id: execute_write
      display_name: Execute Microsoft SQL Server write
      workflow_visible: true
      operation_kind: action
      category: database
      description: Execute one parameterized INSERT, UPDATE or DELETE using the selected
        project connection. INSERT supports database-specific upsert syntax.
      connection_type_ids:
      - toolbox_sql_writer
      required_scopes:
      - extension:invoke
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
      - name: sql
        value_type: text
        required: true
      - name: params
        value_type: object
        required: false
      - name: param_schema
        value_type: object
        required: false
      outputs:
      - name: status
        value_type: text
      - name: rows
        value_type: array
      - name: returned_row_count
        value_type: integer
      result_fields:
      - result.status
      - result.rows
      - result.returned_row_count
      error_codes:
      - invalid_payload
      - write_outcome_unknown
    - operation_id: test_connection
      workflow_visible: false
      operation_kind: action
      description: Validate that the Microsoft SQL Server driver can list tables for
        the configured Microsoft SQL Server connection.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.status
      - result.connector_id
      - result.metadata.toolbox_prebuilt
      error_codes:
      - invalid_config
      - not_found
      - permission_denied
      - connector_runtime_failed
      - unknown_action
    - operation_id: introspect_schema
      workflow_visible: false
      operation_kind: action
      description: Return a normalized typed schema snapshot from the Microsoft SQL
        Server driver list_tables output.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.schema_snapshot.schema_version
      - result.schema_snapshot.resources[].resource_id
      - result.schema_snapshot.resources[].columns[].name
      - result.schema_snapshot.resources[].indexes[].columns[]
      - result.resource_count
      error_codes:
      - invalid_config
      - not_found
      - permission_denied
      - connector_runtime_failed
      - unknown_action
    - operation_id: validate_query
      workflow_visible: false
      operation_kind: action
      description: Validate a saved read-only query template against dataset resource
        scope.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.valid
      - result.read_only
      - result.referenced_resources[]
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: preview_query
      workflow_visible: false
      operation_kind: action
      description: Execute a bounded read-only preview for a validated query template.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.rows[]
      - result.row_count
      - result.output_schema
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: execute_template
      workflow_visible: false
      operation_kind: action
      description: Execute a saved read-only query template with named parameters
        and runtime row limits.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.rows[]
      - result.row_count
      - result.output_schema
      - result.truncated
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: infer_output_schema
      workflow_visible: false
      operation_kind: action
      description: Infer output schema from a bounded read-only preview of the query
        template.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.output_schema
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    resource_query_manifest:
    - query_id: runtime_health
      cursor_mode: none
      description: Return extension runtime health.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.status
      - result.extension_id
      error_codes:
      - unknown_query
      - connector_runtime_failed
    - query_id: supported_connectors
      cursor_mode: none
      description: Return the supported connector catalog for this extension.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.connectors[].connector_type_id
      - result.connectors[].display_name
      - result.connectors[].database_kind
      - result.connectors[].source_provider
      - result.connectors[].access_mode
      error_codes:
      - unknown_query
      - connector_runtime_failed
