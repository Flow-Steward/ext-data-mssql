$schema: https://json-schema.org/draft/2020-12/schema
title: Microsoft SQL Server secrets
type: object
additionalProperties: false
properties:
  password:
    type: string
    title: Password
    minLength: 1
    description: Password is required for mssql, cloud-sql-mssql. Supply password
      or the matching profile-specific secret env variable. Managed PostgreSQL/MySQL/AlloyDB
      IAM profiles keep password optional; public config env is not a credential source.
  env:
    type: object
    title: Profile-specific secret environment
    additionalProperties: false
    properties:
      CLOUD_SQL_MSSQL_PASSWORD:
        type: string
        minLength: 1
      MSSQL_PASSWORD:
        type: string
        minLength: 1
description: Password is required for mssql, cloud-sql-mssql. Supply password or the
  matching profile-specific secret env variable. Managed PostgreSQL/MySQL/AlloyDB
  IAM profiles keep password optional; public config env is not a credential source.
anyOf:
- required:
  - password
- required:
  - env
  properties:
    env:
      anyOf:
      - required:
        - CLOUD_SQL_MSSQL_PASSWORD
      - required:
        - MSSQL_PASSWORD
